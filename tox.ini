[tox]
skipsdist = true
args_are_paths = false
envlist =
    flake8,
    isort,
    py{310,314}-{4.2,5.0,5.1,5.2,6.0,main}

[testenv]
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
usedevelop = true
commands =
    coverage run {envbindir}/django-admin test -v2 --settings=tests.settings {posargs}
    coverage report
deps =
    coverage
    4.2: Django>=4.2,<5.0
    5.0: Django>=5.0,<5.1
    5.1: Django>=5.1,<5.2
    5.2: Django>=5.2,<6.0
    6.0: Django>=6.0,<6.1
    main: https://github.com/django/django/archive/main.tar.gz

[testenv:flake8]
usedevelop = false
basepython = python3.10
commands = flake8
deps = flake8

[testenv:isort]
usedevelop = false
basepython = python3.10
commands = isort --recursive --check-only --diff colorful tests
deps = isort<8.0
